# Release binaries use the MSVC static CRT so the installed executables do not
# require a separately deployed Visual C++ runtime. Keep target-specific flags
# explicit so Linux/macOS builds remain unaffected.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
