[package]
name = "clens-gui"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[features]
default = []
tauri-shell = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
clens-types = { path = "../clens-types" }
clens-daemon-client = { path = "../clens-daemon-client" }
clens-assist = { path = "../clens-assist" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[[bin]]
name = "clens-gui"
path = "src/main.rs"

